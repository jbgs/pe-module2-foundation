name: Agent sandbox

# Runs the scripted agent in a sandbox, in three ways, and fails if anything gets out.
#
#   enforce    the policy decides first; only allowed actions run
#   bypass     the policy is switched off and every action runs in the sandbox, to show that the runtime
#              stops the attempts by itself
#   weakening  the negative controls: each limit is removed in turn and the attempt it holds back must escape,
#              to show that every limit matters and that this test can fail
#
# It needs no credentials and no cloud account: the runner is a throwaway machine, the sandbox is a container
# with no network, and nothing here can reach the repository's secrets. It runs on every pull request, so it
# can be a required check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run of a pull request that is out of date. A run on main is never cancelled, and never
# waits behind another: it may be half way through writing the records to the store, and a log published in part is
# worse than one not published. A group holds one running and one pending run, and a newer pending run replaces the
# older one, so a group shared by every run on main would drop the records of some commits. Each run on main gets
# a group of its own, and since its objects have names of their own, runs do not interfere.
concurrency:
  group: agent-sandbox-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  escape-test:
    name: Agent sandbox escape test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The policy engine is a single binary, fetched by version and refused unless its checksum matches.
      - name: Install the pinned policy engine
        env:
          OPA_VERSION: v1.21.4
          OPA_SHA256: 2ab571f367f293bb19523b76f92f1945bbf245003392c7f392903f95c2b9b630
        run: |
          curl -fsSL -o opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum --check --strict
          mkdir -p "${HOME}/bin"
          install -m 0755 opa "${HOME}/bin/opa"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Tests of the enforcement point and of the audit gate
        run: python3 -m unittest discover -s agent -v

      # A test of the tests: the audit code is weakened on purpose in 42 ways, and the tests must notice each one.
      - name: The tests catch a weakened audit gate
        run: python3 agent/mutation_check.py

      - name: Build the sandbox image
        run: docker build -t agent-sandbox:ci agent/sandbox

      - name: The policy decides, the sandbox runs
        id: enforce
        run: python3 agent/run_agent.py --mode enforce

      # always(): the hard boundary is tested even when the policy layer has failed, because that is the case
      # the boundary is for.
      - name: Escape attempts with the policy switched off
        id: bypass
        if: always()
        run: python3 agent/run_agent.py --mode bypass

      # A test that has never failed proves little. Each limit is removed in turn and the attempt it holds back
      # must then escape: if it does not, that limit was not what stopped it, or this test cannot see the escape.
      - name: The test can fail, each limit removed in turn
        id: controls
        if: always()
        run: python3 agent/run_agent.py --mode weakening

      # The audit gate: a log that is incomplete, inconsistent or altered is refused. It reads the files from disk in a
      # separate process. The manifest is written by the same run, so it protects against editing after the fact and
      # not against the pipeline itself; the store that closes that is the next change. All three logs are checked
      # even if one is refused, so the diagnosis is complete.
      - name: Audit gate
        if: always()
        run: |
          status=0
          # The expectation for the controls comes from the code, not from a file that travelled with the log.
          python3 agent/controls_plan.py > "${RUNNER_TEMP}/plan-weakening.json"
          python3 agent/audit_verify.py agent/out/audit-enforce.jsonl --manifest agent/out/audit-enforce.manifest.json --expect agent/plan.json || status=1
          python3 agent/audit_verify.py agent/out/audit-bypass.jsonl --manifest agent/out/audit-bypass.manifest.json --expect agent/plan.json || status=1
          python3 agent/audit_verify.py agent/out/audit-weakening.jsonl --manifest agent/out/audit-weakening.manifest.json --expect "${RUNNER_TEMP}/plan-weakening.json" || status=1
          exit "${status}"

      # A gate that has never refused anything proves nothing. The real log of this run is damaged four ways, and each
      # must be refused.
      - name: The audit gate can fail
        if: always()
        run: python3 agent/audit_verify.py agent/out/audit-enforce.jsonl --manifest agent/out/audit-enforce.manifest.json --expect agent/plan.json --tamper-test

      - name: Keep the records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-run
          path: agent/out/
          retention-days: 90
          if-no-files-found: warn

  # Publishes the logs to the audit store, where the pipeline that wrote them cannot change them (ADR 0006).
  #
  # - Only on main, and only after every check above has passed. A pull request, whose workflow its author can
  #   change, never writes to the store; the role it would need cannot be assumed from anywhere else.
  # - No `environment:` here: it would change the subject of the token and stop matching the role.
  # - The role can only write. The script then tries, with that same role, to change what it wrote, and every attempt
  #   must be refused.
  publish-audit:
    name: Publish the audit records
    needs: escape-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch the records of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-run
          path: agent/out

      # The records crossed from one job to another, so the gate is run again on what arrived, before anything is written.
      - name: Audit gate on what was fetched
        run: |
          status=0
          python3 agent/controls_plan.py > "${RUNNER_TEMP}/plan-weakening.json"
          python3 agent/audit_verify.py agent/out/audit-enforce.jsonl --manifest agent/out/audit-enforce.manifest.json --expect agent/plan.json || status=1
          python3 agent/audit_verify.py agent/out/audit-bypass.jsonl --manifest agent/out/audit-bypass.manifest.json --expect agent/plan.json || status=1
          python3 agent/audit_verify.py agent/out/audit-weakening.jsonl --manifest agent/out/audit-weakening.manifest.json --expect "${RUNNER_TEMP}/plan-weakening.json" || status=1
          exit "${status}"

      # The role that can only write, and only from main.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/pe-lab-gha-audit-writer
          aws-region: us-east-1

      - name: Publish, then try to change what was published
        run: |
          aws --version
          python3 agent/publish_audit.py publish --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
